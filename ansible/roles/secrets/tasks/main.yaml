# 許可一覧と runner と夜間の起動のラベルを JSON にして書くだけ。合言葉・秘密の値・プロファイル名は扱わない
# （プロファイル名の展開は files/secrets.sh の shell 変数の中だけで行う）。

- name: Validate the action and the input file path
  ansible.builtin.assert:
    that:
      - secrets_action == 'prepare'
      - secrets_input_file is match('^/.+')
    fail_msg: "secrets_action は prepare のみ。入力の書き先 SECRETS_INPUT_FILE は絶対パスで指定する（使うのは make secrets-*）"
    quiet: true

- name: Write the input JSON (mode 0600)
  ansible.builtin.copy:
    dest: "{{ secrets_input_file }}"
    mode: "0600"
    content: >-
      {{ {
        'entries': doctor_config_files,
        'profile_repos': doctor_profile_repos,
        'profiles_override': secrets_profiles_override_json | from_json,
        'runners': doctor_runners,
        'launcher_labels': doctor_launcher_labels
      } | to_json }}
  no_log: true
  changed_when: false
