# 動作は prepare だけ（入力の用意）。list / export / import / restore は Makefile が secrets.sh を直接実行する
secrets_action: prepare
# 入力 JSON の書き先（Makefile が mktemp で選び、環境変数で渡す。絶対パスで、既に在る 0600 のファイル）
secrets_input_file: "{{ lookup('env', 'SECRETS_INPUT_FILE') }}"

# --- テスト専用の差し込み口（実運用では使わない）---------------------------------------
# NotebookLM のプロファイル名の差し替え（JSON の配列の文字列）。空配列なら GitHub の変数を読む
secrets_profiles_override_json: "{{ lookup('env', 'SECRETS_PROFILES_OVERRIDE') | default('[]', true) }}"
