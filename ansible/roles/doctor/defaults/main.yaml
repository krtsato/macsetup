# 点検の PHASE。pre-import（持ち込み前）/ cutover（切り替え中）/ ready（稼働）
doctor_phase: ready

# テスト用に差し替えられるパスの根。既定は実際のホームと LaunchAgents
doctor_home: "{{ lookup('env', 'HOME') }}"
doctor_launchagents_dir: "{{ doctor_home }}/Library/LaunchAgents"

# テスト用の差し込み口（壊して確かめる scripts/test-doctor.sh が使う）
# 追加の点検対象（vars/main.yaml の doctor_config_files と同じ形）
doctor_extra_config_files: []
# 複製の場所の差し替え。キーは "リポジトリ/変数名"、値はパス
doctor_clone_dir_overrides: {}
# OpenD の判定に使う「いま」の上書き（日本時間。例 2026-10-17T00:30）。空なら実際の時刻
doctor_now: ""
