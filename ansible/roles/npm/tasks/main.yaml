- name: Install npm global packages
  # node は mise 管理のため、mise ロールの後に実行する必要がある。
  # node のバージョンが上がるとグローバルパッケージは引き継がれないので、
  # 冪等に再インストールできるようこのロールで一括管理する。
  ansible.builtin.shell: |
    export PATH="$HOME/.local/share/mise/shims:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin"
    npm install -g {{ npm_install_targets | join(' ') }}
  register: npm_install
  changed_when: npm_install.rc == 0
  failed_when: npm_install.rc != 0
