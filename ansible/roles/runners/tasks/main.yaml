# 実行役を登録し、常駐の設定（LaunchAgent の plist）まで作る。起動は runners_enabled が真のときだけ。
# 既に登録済みの端末（.runner がある）では、ダウンロードも登録もしない。

- name: Read the local host name for runner names
  ansible.builtin.command: scutil --get LocalHostName
  environment:
    PATH: "{{ runners_path }}"
  register: runners_hostname
  changed_when: false
  when: runners_name_suffix == ""

- name: Decide the runner name suffix
  ansible.builtin.set_fact:
    # GitHub の名前に使える文字だけに揃える
    runners_suffix: "{{ (runners_name_suffix if runners_name_suffix != '' else runners_hostname.stdout) | regex_replace('[^A-Za-z0-9._-]', '-') }}"

- name: Prepare each runner
  ansible.builtin.include_tasks: runner.yaml
  loop: "{{ runners_list }}"
  loop_control:
    loop_var: runners_item
    label: "{{ runners_item.repo }}/{{ runners_item.label }}"
