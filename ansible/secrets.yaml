# 秘密と処理済みの記録を暗号化ディスクイメージで運ぶ（段 2）の入力を用意する。
# ここは許可一覧（正本 roles/doctor/vars/main.yaml）と実行役・起動役のラベルを JSON にして
# Makefile が選んだ 0600 の一時ファイルへ書くだけ（secrets_action=prepare）。
# 本体の scripts は Makefile が端末へ繋いだまま直接実行する（Ansible の子プロセスは制御端末を持たず、
# hdiutil が合言葉を尋ねられないため）。使うのは `make secrets-*`。
- name: Prepare the input for carrying secrets in an encrypted disk image
  hosts: default
  connection: local
  gather_facts: false
  vars_files:
    - roles/doctor/vars/main.yaml
  roles:
    - secrets
